<!doctype html><html><head><link rel="stylesheet" href="assets/css/strip.css"><style>.strip{width:1280px;height:720px;position:relative}</style></head><body><div class="strip" id="r"></div>
<script>const v=Date.now();document.write('<script src="assets/js/strip.js?'+v+'"><\/script><script src="assets/js/strip-scenes.js?'+v+'"><\/script>')</script>
<script>
window.runAll=()=>{const ids=['ai-native-design-system','airtel','group-alarm','hope-house','insider-vibes','makemytrip','moneylingo','paytm-chat','planteria','poll-police','snapshot','storewell','winuall','divergent-minds-convergent-design'];const out={};
for(const id of ids){const r=document.getElementById('r');let p,errs=[];try{p=SNStrip.Player(r,id,{title:id,lede:''});}catch(e){out[id]='CTOR '+e.message;continue;}
for(let t=0;t<=p.total+.5;t+=.05){try{p.seek(t)}catch(e){errs.push(t.toFixed(2)+' '+e.message);if(errs.length>3)break;}}
out[id]=errs.length?errs:('ok '+p.total.toFixed(1)+'s');}
return out;}
</script></body></html>
