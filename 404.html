<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Samarth Nayyar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<style>
  html,body{margin:0;height:100%;background:#f6f6f4;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Manrope,sans-serif}
  main{min-height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  p{margin:0 0 12px;font-size:15px;line-height:1.5}
  a{color:inherit}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div id="go" hidden><p>Opening Samarth&rsquo;s portfolio&hellip;</p><p><a id="go-link" href="/">Continue</a></p></div>
  <div id="nf" hidden><p>This page doesn&rsquo;t exist.</p><p><a href="/">Go to samarthnayyar.com</a></p></div>
  <noscript><p><a href="/">Go to samarthnayyar.com</a></p></noscript>
</main>
<script>
/*
  Application link router (TEST VERSION, GitHub Pages fallback).
  GitHub Pages serves this file for any path with no page, so /r/<slug> lands here.
  It marks the visitor with the application cookie and forwards them; the
  destination page (assets/js/app-link.js) records the open in Umami.
  Production does the same with a real 302 from the Fly.io link service.
*/
(function () {
  // slug -> [destination, company, role]. Test entries only.
  var LINKS = {
    "test-alpha": ["/", "test-alpha-co", "Test role A"],
    "test-beta":  ["/case-studies/ai-native-design-system.html", "test-beta-co", "Test role B"]
  };
  var m = location.pathname.toLowerCase().match(/^\/r\/([a-z0-9][a-z0-9-]{0,80})\/?$/);
  if (!m) { document.getElementById("nf").hidden = false; return; }
  var slug = m[1];
  var row = Object.prototype.hasOwnProperty.call(LINKS, slug) ? LINKS[slug] : ["/", "unknown", ""];
  var app = encodeURIComponent(JSON.stringify({ s: slug, c: row[1], r: row[2] }));
  document.cookie = "sn_app=" + app + "; Path=/; Max-Age=2592000; SameSite=Lax; Secure";
  document.cookie = "sn_new=1; Path=/; Max-Age=600; SameSite=Lax; Secure";
  document.getElementById("go-link").href = row[0];
  document.getElementById("go").hidden = false;
  location.replace(row[0]);
})();
</script>
</body>
</html>
